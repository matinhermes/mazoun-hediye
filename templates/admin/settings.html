<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تنظیمات | ادمین</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"></head><body>
<header class="header"><div class="container"><div class="header-inner"><a href="/" class="logo"><img src="/static/images/logo.jpg" alt="مزون هدیه"><div class="logo-text">پنل <span>ادمین</span></div></a></div></div></header>
<div class="container"><div style="display:grid;grid-template-columns:220px 1fr;gap:30px;padding:30px 0">
<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px">
<a href="/admin" style="display:block;padding:10px;color:var(--text-sec);text-decoration:none;border-radius:6px;margin-bottom:4px">داشبورد</a>
<a href="/admin/products" style="display:block;padding:10px;color:var(--text-sec);text-decoration:none;border-radius:6px;margin-bottom:4px">محصولات</a>
<a href="/admin/orders" style="display:block;padding:10px;color:var(--text-sec);text-decoration:none;border-radius:6px;margin-bottom:4px">سفارشات</a>
<a href="/admin/settings" style="display:block;padding:10px;color:var(--primary);text-decoration:none;background:var(--bg-lighter);border-radius:6px;margin-bottom:4px">تنظیمات</a></div>
<div>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for cat, msg in messages %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}{% endwith %}
<h1 style="font-family:'Playfair Display',serif;color:var(--primary);margin-bottom:30px">تنظیمات فروشگاه</h1>
<form method="POST" style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:600px">
{% for key, value in settings.items() %}<div style="margin-bottom:16px"><label style="display:block;margin-bottom:6px;color:var(--text-sec);font-size:13px">{{ key }}</label><input name="{{ key }}" value="{{ value }}" style="width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit"></div>{% endfor %}
<button type="submit" style="padding:12px 30px;background:var(--primary);border:none;border-radius:8px;color:#000;font-weight:700;cursor:pointer;font-family:inherit">ذخیره</button></form>
</div></div></div>
<footer class="footer"><div class="container"><div class="footer-bottom"><p>© ۱۴۰۵ مزون هدیه</p></div></div></footer></body></html>
