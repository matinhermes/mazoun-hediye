{% extends "admin/base.html" %}
{% block title %}کاربران{% endblock %}
{% block content %}
<h1 class="page-title">کاربران</h1>
<div class="card" style="overflow-x:auto">
<table class="table">
<tr><th>نام</th><th>نام کاربری</th><th>ایمیل</th><th>تلفن</th><th>تاریخ</th></tr>
{% for u in users %}
<tr>
<td>{{ u.full_name or u.username }}</td>
<td>{{ u.username }}</td>
<td>{{ u.email }}</td>
<td>{{ u.phone or '-' }}</td>
<td style="font-size:12px;color:#888">{{ u.created_at }}</td>
</tr>{% endfor %}
</table></div>
{% endblock %}
