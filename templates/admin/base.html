<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>پنل مدیریت - مزون هدیه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#5B2E91;--primary-light:#7B4FB5;--bg:#F7F8F9;--white:#fff;--text:#1A1A1A;--text2:#666;--border:#E8E8E8;--red:#E53935;--green:#2E7D32;--blue:#1976D2;--yellow:#FF9800;--badge-red:#E53935}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:70px}

/* TOP BAR */
.topbar{background:var(--white);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.topbar-logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#c9a96e,#b76e79);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.topbar-name{font-size:16px;font-weight:600;flex:1}
.topbar-icon{font-size:20px;cursor:pointer;padding:4px;color:var(--text2)}

/* SEARCH BARS */
.search-row{display:flex;gap:8px;padding:12px 16px}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text2)}

/* QUICK ACCESS */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--white);border-radius:10px;border:1px solid var(--border);cursor:pointer;position:relative;transition:all 0.2s}
.quick-btn:active{background:#f0f0f0}
.quick-btn .icon{font-size:24px}
.quick-btn .label{font-size:11px;font-weight:500;color:var(--text);text-align:center}
.quick-btn .badge{position:absolute;top:6px;left:6px;background:var(--badge-red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* SECTIONS */
.section{padding:12px 16px}
.section-title{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title .icon{font-size:18px}

/* CARD PANEL */
.panel{background:var(--white);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.panel-header{padding:12px 16px;background:var(--bg);font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
.panel-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.2s}
.panel-item:last-child{border-bottom:none}
.panel-item:active{background:#f5f5f5}
.panel-item .pi-icon{font-size:20px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(91,46,145,0.1)}
.panel-item .pi-text{flex:1;font-size:13px;font-weight:500}
.panel-item .pi-badge{background:var(--badge-red);color:#fff;font-size:10px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.panel-item .pi-arrow{color:#ccc;font-size:14px}

/* ORDER CARD */
.order-card{background:var(--white);border-radius:12px;border:1px solid var(--border);margin:0 16px 10px;overflow:hidden}
.order-card-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);font-size:12px}
.order-card-body{padding:12px 14px}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px}
.order-label{color:var(--text2)}
.order-value{font-weight:600}
.order-status{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.status-pending{background:#FFF3E0;color:#E65100}
.status-sent{background:#E8F5E9;color:#2E7D32}
.status-delivered{background:#E3F2FD;color:#1565C0}
.order-actions{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--border)}
.order-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.order-btn.primary{background:var(--primary);color:#fff}
.order-btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}

/* PRODUCT CARD */
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 16px}
.product-card{background:var(--white);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.product-img{height:140px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-info{padding:10px}
.product-name{font-size:12px;font-weight:500;margin-bottom:4px;line-height:1.5}
.product-price{font-size:13px;font-weight:700;color:var(--primary)}
.product-stock{font-size:11px;color:var(--text2);margin-top:2px}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:100;padding:6px 0 env(safe-area-inset-bottom,0)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10px;color:var(--text2);text-decoration:none;transition:color 0.2s}
.bottomnav a.active{color:var(--primary)}
.bottomnav a .bi{font-size:20px}

/* FLASH */
.flash{padding:10px 16px;margin:12px 16px 0;border-radius:8px;font-size:13px}
.flash.success{background:#E8F5E9;color:#2E7D32}
.flash.danger{background:#FFEBEE;color:#C62828}
.flash.warning{background:#FFF3E0;color:#E65100}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-logo">مـ</div>
  <div class="topbar-name">مزون هدیه</div>
  <a href="/" class="topbar-icon">🏠</a>
</div>

<!-- Flash Messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}
<div class="flash {{ cat }}">{{ msg }}</div>
{% endfor %}
{% endwith %}

<!-- Main Content -->
<div style="min-height:calc(100vh - 130px)">
{% block content %}{% endblock %}
</div>

<!-- Bottom Navigation -->
<div class="bottomnav">
  <a href="/admin" class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
    <span class="bi">🏠</span>خانه
  </a>
  <a href="/admin/products" class="{% if request.endpoint and 'product' in request.endpoint %}active{% endif %}">
    <span class="bi">📦</span>محصولات
  </a>
  <a href="/admin/orders" class="{% if request.endpoint and 'order' in request.endpoint %}active{% endif %}">
    <span class="bi">📋</span>سفارشات
  </a>
  <a href="/admin/banners" class="{% if request.endpoint == 'admin_banners' %}active{% endif %}">
    <span class="bi">🖼️</span>بنرها
  </a>
  <a href="/admin/settings" class="{% if request.endpoint == 'admin_settings' %}active{% endif %}">
    <span class="bi">⚙️</span>تنظیمات
  </a>
</div>

</body>
</html>
