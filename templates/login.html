<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | مزون هدیه</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #c9a96e; --bg: #0a0a0a; --bg-card: #111; --text: #e8e8e8; --border: #222; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { width: 100%; max-width: 400px; padding: 40px; }
        .login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; }
        .logo { text-align: center; font-family: 'Playfair Display', serif; font-size: 32px; color: var(--primary); margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: var(--text); margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .btn { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 8px; color: #000; font-weight: 600; font-family: inherit; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn:hover { background: var(--primary-dark); }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: var(--primary); text-decoration: none; font-size: 14px; }
        .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .flash-success { background: rgba(40, 167, 69, 0.15); border: 1px solid #28a745; color: #28a745; }
        .flash-danger { background: rgba(220, 53, 69, 0.15); border: 1px solid #dc3545; color: #dc3545; }
        .flash-warning { background: rgba(201, 169, 110, 0.15); border: 1px solid var(--primary); color: var(--primary); }
        .flash-info { background: rgba(183, 110, 121, 0.15); border: 1px solid #b76e79; color: #b76e79; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">مزون <span style="color: #b76e79;">هدیه</span></div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST">
                <div class="form-group">
                    <label>نام کاربری</label>
                    <input type="text" name="username" required placeholder="نام کاربری خود را وارد کنید">
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" name="password" required placeholder="رمز عبور خود را وارد کنید">
                </div>
                <button type="submit" class="btn">ورود</button>
            </form>
            
            <div class="links">
                <a href="{{ url_for('register') }}">حساب کاربری ندارید؟ ثبت‌نام کنید</a>
            </div>
        </div>
    </div>
</body>
</html>
