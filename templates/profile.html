<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>پروفایل | مزون هدیه</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"></head><body>
<header class="header"><div class="container"><div class="header-inner"><a href="/" class="logo"><img src="/static/images/logo.jpg" alt="مزون هدیه"><div class="logo-text">مزون <span>هدیه</span></div></a><div class="header-actions"><a href="/cart" class="hdr-btn">🛒</a><a href="/logout" class="hdr-btn" style="color:var(--danger)">🚪</a></div></div></div></header>
<div class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for cat, msg in messages %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}{% endwith %}
<h1 style="font-family:'Playfair Display',serif;color:var(--primary);margin:30px 0">پروفایل من</h1>
<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:24px">
<form method="POST" action="/profile/update">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div><label style="display:block;margin-bottom:6px;color:var(--text-sec);font-size:13px">نام کامل</label><input name="full_name" value="{{ user.full_name or '' }}" style="width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit"></div>
<div><label style="display:block;margin-bottom:6px;color:var(--text-sec);font-size:13px">موبایل</label><input name="phone" value="{{ user.phone or '' }}" style="width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit"></div></div>
<div style="margin-top:16px"><label style="display:block;margin-bottom:6px;color:var(--text-sec);font-size:13px">آدرس</label><textarea name="address" rows="3" style="width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;resize:vertical">{{ user.address or '' }}</textarea></div>
<button type="submit" style="margin-top:16px;padding:12px 24px;background:var(--primary);border:none;border-radius:8px;color:#000;font-weight:600;cursor:pointer;font-family:inherit">ذخیره تغییرات</button></form></div>
<div style="margin-top:20px"><a href="/orders" style="color:var(--primary)">مشاهده سفارشات</a> | <a href="/logout" style="color:var(--danger)">خروج</a></div></div>
<footer class="footer"><div class="container"><div class="footer-bottom"><p>© ۱۴۰۵ مزون هدیه</p></div></div></footer></body></html>
